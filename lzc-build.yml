manifest: ./lzc-manifest.yml
pkgout: ./dist
icon: ./icon.png
contentdir: ./content
compose_override:
  services:
    headscale:
      read_only: true
      tmpfs:
        - /tmp
      labels:
        me.tale.headplane.target: headscale
    headplane:
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
