manifest: ./lzc-manifest.yml
pkgout: ./dist
icon: ./icon.png
compose_override:
  services:
    headscale:
      container_name: headscale
      read_only: true
      tmpfs:
        - /tmp
      labels:
        me.tale.headplane.target: headscale
    headplane:
      volumes:
        - /data/playground/docker.sock:/var/run/docker.sock:ro
