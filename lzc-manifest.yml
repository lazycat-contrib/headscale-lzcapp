application:
  subdomain: headscale
  entries:
    - id: headplane
      title: Headplane
      path: /admin
    - id: headscale
      title: Headscale
      path: /
  upstreams:
    - location: /admin
      backend: http://headplane:3000/admin
    - location: /
      backend: http://headscale:8080/
services:
  config-init:
    # busybox:1.36
    # upstream: busybox:1.38.0
    image: registry.lazycat.cloud/czyt/library/busybox:97083f278fb92df7
    environment:
      - PUBLIC_URL=https://{{.S.AppDomain}}
      - TAILNET_DOMAIN={{ .U.tailnet_domain }}
      - HEADPLANE_COOKIE_SECRET={{ .U.headplane_cookie_secret }}
    command: |
      sh -c '
        mkdir -p /etc/headscale /etc/headplane /var/lib/headscale /var/lib/headplane
        if [ ! -f /etc/headscale/dns_records.json ]; then
          printf "[]\n" > /etc/headscale/dns_records.json
        fi
        if [ ! -f /etc/headscale/config.yaml ]; then
          cat > /etc/headscale/config.yaml <<EOF
      server_url: "${PUBLIC_URL}"
      listen_addr: 0.0.0.0:8080
      metrics_listen_addr: 127.0.0.1:9090
      grpc_listen_addr: 127.0.0.1:50443
      grpc_allow_insecure: false
      trusted_proxies: []
      noise:
        private_key_path: /var/lib/headscale/noise_private.key
      prefixes:
        v4: 100.64.0.0/10
        v6: fd7a:115c:a1e0::/48
        allocation: sequential
      derp:
        server:
          enabled: false
          region_id: 999
          region_code: headscale
          region_name: Headscale Embedded DERP
          verify_clients: true
          stun_listen_addr: 0.0.0.0:3478
          private_key_path: /var/lib/headscale/derp_server_private.key
          automatically_add_embedded_derp_region: true
        urls:
          - https://controlplane.tailscale.com/derpmap/default
        paths: []
        auto_update_enabled: true
        update_frequency: 3h
      disable_check_updates: true
      node:
        expiry: 0
        ephemeral:
          inactivity_timeout: 30m
        routes:
          ha:
            probe_interval: 10s
            probe_timeout: 5s
      database:
        type: sqlite
        debug: false
        gorm:
          prepare_stmt: true
          parameterized_queries: true
          skip_err_record_not_found: true
          slow_threshold: 1000
        sqlite:
          path: /var/lib/headscale/db.sqlite
          write_ahead_log: true
          wal_autocheckpoint: 1000
      acme_url: https://acme-v02.api.letsencrypt.org/directory
      acme_email: ""
      tls_letsencrypt_hostname: ""
      tls_letsencrypt_cache_dir: /var/lib/headscale/cache
      tls_letsencrypt_challenge_type: HTTP-01
      tls_letsencrypt_listen: ":http"
      tls_cert_path: ""
      tls_key_path: ""
      log:
        level: info
        format: text
      policy:
        mode: file
        path: ""
      dns:
        magic_dns: true
        base_domain: "${TAILNET_DOMAIN}"
        override_local_dns: true
        nameservers:
          global:
            - 1.1.1.1
            - 1.0.0.1
            - 2606:4700:4700::1111
            - 2606:4700:4700::1001
          split: {}
        search_domains: []
        extra_records_path: /etc/headscale/dns_records.json
      unix_socket: /var/run/headscale/headscale.sock
      unix_socket_permission: "0770"
      logtail:
        enabled: false
      taildrop:
        enabled: true
      auto_update:
        enabled: false
      EOF
        fi
        if [ ! -f /etc/headplane/config.yaml ]; then
          cat > /etc/headplane/config.yaml <<EOF
      server:
        host: 0.0.0.0
        port: 3000
        base_url: "${PUBLIC_URL}"
        cookie_secret: "${HEADPLANE_COOKIE_SECRET}"
        cookie_secure: true
        cookie_max_age: 86400
        data_path: /var/lib/headplane
      headscale:
        url: http://headscale:8080
        public_url: "${PUBLIC_URL}"
        config_path: /etc/headscale/config.yaml
        dns_records_path: /etc/headscale/dns_records.json
      integration:
        agent:
          enabled: false
        docker:
          enabled: true
          container_label: me.tale.headplane.target=headscale
          socket: unix:///var/run/docker.sock
        kubernetes:
          enabled: false
          pod_name: ""
      EOF
        fi
        sleep infinity
      '
    binds:
      - /lzcapp/var/headscale/config:/etc/headscale
      - /lzcapp/var/headscale/lib:/var/lib/headscale
      - /lzcapp/var/headplane/config:/etc/headplane
      - /lzcapp/var/headplane/lib:/var/lib/headplane
  headscale:
    # headscale/headscale:v0.29.3
    # upstream: headscale/headscale:v0.29.3
    image: registry.lazycat.cloud/czyt/headscale/headscale:1307b4d355efbcf1
    command: serve
    depends_on:
      - config-init
    binds:
      - /lzcapp/var/headscale/config:/etc/headscale
      - /lzcapp/var/headscale/lib:/var/lib/headscale
    tmpfs:
      - /var/run/headscale
    healthcheck:
      test:
        - CMD
        - headscale
        - health
  headplane:
    # ghcr.io/tale/headplane:0.7.0
    # upstream: ghcr.io/tale/headplane:0.7.0
    image: registry.lazycat.cloud/czyt/tale/headplane:83c5031d9ddb00cc
    depends_on:
      - config-init
      - headscale
    binds:
      - /lzcapp/var/headplane/config:/etc/headplane
      - /lzcapp/var/headplane/lib:/var/lib/headplane
      - /lzcapp/var/headscale/config:/etc/headscale
      - /lzcapp/var/headscale/lib:/var/lib/headscale
    healthcheck:
      test:
        - CMD
        - /bin/hp_healthcheck
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
usage: |
  Open /admin to access the Headplane management UI.

  On first use, create a Headscale API key from the headscale service:
  headscale apikeys create --expiration 90d

  Headplane network-management mode uses the shared Headscale configuration directory and Docker socket access configured in lzc-build.yml compose_override.
